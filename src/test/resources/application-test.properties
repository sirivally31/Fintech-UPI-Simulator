# ======================================================
# Enterprise Test Profile Configuration (application-test.properties)
# ======================================================

# Spring & JPA settings for testing environment
spring.main.allow-bean-definition-overriding=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Test Properties
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlQmFzZTY0S2V5Rm9ySldUQXV0aGVudGljYXRpb25BbmRVUElTaW11bGF0b3IyMDI2
jwt.expiration=3600000

# Scheduler control for isolated test execution
scheduling.enabled=false

# Kafka Test Defaults
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=upi-test-group

# Logging Overrides for Test Verification
logging.level.org.springframework.test=INFO
logging.level.com.example.demo=DEBUG
